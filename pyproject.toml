[project]
name = "local-mendix-agent"
version = "0.1.0"
description = "Local, offline-capable AI coding agent specialised in Mendix Studio Pro (Maia MCP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.6",
    "pyyaml>=6",
    "rich>=13",
    "prompt_toolkit>=3.0.40",
    "httpx>=0.27",
    "psutil>=5.9",
    "numpy>=1.26",
    "pillow>=10",
    "keyring>=24",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lma = "lma.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "maia: needs a running Mendix Studio Pro MCP server (set LMA_MAIA_URL)",
    "model: needs a downloaded local model and llama.cpp runtime",
]

[tool.setuptools.packages.find]
include = ["lma*"]
