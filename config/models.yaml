# Model catalogue. Every repo/file below was checked against the Hugging Face API on 2026-11-12
# (existence, size, licence tag, not gated). Exact size and SHA-256 are fetched again from the
# Hub at download time and verified after the download; nothing is trusted from this file.
#
# tools:  "template" = the GGUF chat template declares tool calls and llama-server (--jinja)
#         turns them into OpenAI-style tool_calls. Reliability still depends on model size:
#         small models call tools less reliably. The agent also parses <tool_call> text blocks.
# ctx_max: maximum context from the model card. ctx actually used is llm.context_size.
# min_ram_gb / min_vram_gb: rule of thumb = file size + ~1.5 GB for an 8k-16k context.
#         min_vram_gb is for full GPU offload; with less VRAM layers are split to CPU RAM.

models:
  # ---------------------------------------------------------------- coding / chat
  - id: qwen2.5-coder-1.5b
    role: chat
    tier: small
    repo: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
    file: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    quant: Q4_K_M
    size_gb: 1.12
    license: apache-2.0
    ctx_max: 32768
    tools: template
    vision: false
    min_ram_gb: 4
    min_vram_gb: 2
    notes: Very fast, CPU friendly. Fine for /ask and simple edits, weak at long multi-step tool use.

